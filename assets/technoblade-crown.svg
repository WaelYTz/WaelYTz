<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Technoblade never dies">
<defs>
  <radialGradient id="bg" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#2a0f22"/><stop offset=".55" stop-color="#140912"/><stop offset="1" stop-color="#0d1117"/></radialGradient>
  <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff4fa3" stop-opacity=".45"/><stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".35" stop-color="#ffd166"/><stop offset=".75" stop-color="#e09f00"/><stop offset="1" stop-color="#a86b00"/></linearGradient>
  <linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#d99400"/><stop offset="1" stop-color="#8f5800"/></linearGradient>
  <radialGradient id="gem" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffd6ea"/><stop offset=".4" stop-color="#ff4fa3"/><stop offset="1" stop-color="#b0145e"/></radialGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4fa3"/><stop offset=".5" stop-color="#ff9ecf"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
  <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="420" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-160 0;360 0;360 0" keyTimes="0;.45;1" dur="3.6s" repeatCount="indefinite"/>
  </linearGradient>
  <clipPath id="crownclip"><path d="M374,154 L362,100 L384,128 L406,80 L428,114 L450,56 L472,114 L494,80 L516,128 L538,100 L526,154 Z"/><rect x="368" y="150" width="164" height="32" rx="5"/></clipPath>
  <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".6"/></filter>
</defs>
<style>
  .float { animation: float 3.2s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .tw { transform-box: fill-box; transform-origin: center; animation: tw 2.4s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.4) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
  .pulse { animation: pulse 3.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .7; } 50% { opacity: 1; } }
  text { font-family: 'Segoe UI Black','Arial Black','Segoe UI',Impact,sans-serif; font-weight: 900; }
</style>
<rect width="900" height="300" rx="16" fill="url(#bg)"/>
<rect x="1.5" y="1.5" width="897" height="297" rx="15" fill="none" stroke="url(#title)" stroke-opacity=".55" stroke-width="2"/>
<ellipse cx="450" cy="118" rx="210" ry="96" fill="url(#halo)" class="pulse"/>
<path d="M318,77 Q318,86 327,86 Q318,86 318,95 Q318,86 309,86 Q318,86 318,77 Z" fill="#fff6d5" class="tw" style="animation-delay:0.0s;animation-duration:2.4s"/><path d="M586,59 Q586,70 597,70 Q586,70 586,81 Q586,70 575,70 Q586,70 586,59 Z" fill="#fff6d5" class="tw" style="animation-delay:0.7s;animation-duration:2.4s"/><path d="M346,154 Q346,160 352,160 Q346,160 346,166 Q346,160 340,160 Q346,160 346,154 Z" fill="#fff6d5" class="tw" style="animation-delay:1.3s;animation-duration:2.4s"/><path d="M566,143 Q566,150 573,150 Q566,150 566,157 Q566,150 559,150 Q566,150 566,143 Z" fill="#fff6d5" class="tw" style="animation-delay:0.4s;animation-duration:2.4s"/><path d="M300,121 Q300,126 305,126 Q300,126 300,131 Q300,126 295,126 Q300,126 300,121 Z" fill="#fff6d5" class="tw" style="animation-delay:1.8s;animation-duration:2.4s"/><path d="M612,112 Q612,118 618,118 Q612,118 612,124 Q612,118 606,118 Q612,118 612,112 Z" fill="#fff6d5" class="tw" style="animation-delay:1.1s;animation-duration:2.4s"/><path d="M450,23 Q450,30 457,30 Q450,30 450,37 Q450,30 443,30 Q450,30 450,23 Z" fill="#fff6d5" class="tw" style="animation-delay:0.9s;animation-duration:2.4s"/>
<g class="float" filter="url(#soft)">
  <path d="M374,154 L362,100 L384,128 L406,80 L428,114 L450,56 L472,114 L494,80 L516,128 L538,100 L526,154 Z" fill="url(#gold)" stroke="#7a4a00" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M392,146 L406,96 L420,142 Z M436,142 L450,80 L464,142 Z M480,142 L494,96 L508,146 Z" fill="#fff8d6" opacity=".22"/>
  <rect x="368" y="150" width="164" height="32" rx="5" fill="url(#band)" stroke="#7a4a00" stroke-width="2.5"/>
  <rect x="372" y="153" width="156" height="5" rx="2" fill="#fff3b0" opacity=".55"/>
  <circle cx="362" cy="93" r="7.5" fill="url(#gold)" stroke="#7a4a00" stroke-width="2"/><circle cx="359.5" cy="90.5" r="2.4" fill="#fffbe6" opacity=".9"/><circle cx="406" cy="73" r="7.5" fill="url(#gold)" stroke="#7a4a00" stroke-width="2"/><circle cx="403.5" cy="70.5" r="2.4" fill="#fffbe6" opacity=".9"/><circle cx="450" cy="49" r="7.5" fill="url(#gold)" stroke="#7a4a00" stroke-width="2"/><circle cx="447.5" cy="46.5" r="2.4" fill="#fffbe6" opacity=".9"/><circle cx="494" cy="73" r="7.5" fill="url(#gold)" stroke="#7a4a00" stroke-width="2"/><circle cx="491.5" cy="70.5" r="2.4" fill="#fffbe6" opacity=".9"/><circle cx="538" cy="93" r="7.5" fill="url(#gold)" stroke="#7a4a00" stroke-width="2"/><circle cx="535.5" cy="90.5" r="2.4" fill="#fffbe6" opacity=".9"/>
  <ellipse cx="450" cy="166" rx="13" ry="9" fill="url(#gem)" stroke="#7a1043" stroke-width="2"/><ellipse cx="446" cy="163" rx="4" ry="2.5" fill="#ffd6ea" opacity=".9"/><rect x="392" y="160" width="12" height="12" rx="2" transform="rotate(45 398 166)" fill="url(#gem)" stroke="#7a1043" stroke-width="1.6"/><rect x="496" y="160" width="12" height="12" rx="2" transform="rotate(45 502 166)" fill="url(#gem)" stroke="#7a1043" stroke-width="1.6"/><circle cx="378" cy="166" r="3.2" fill="#fff3b0" stroke="#7a4a00" stroke-width="1"/><circle cx="422" cy="166" r="3.2" fill="#fff3b0" stroke="#7a4a00" stroke-width="1"/><circle cx="478" cy="166" r="3.2" fill="#fff3b0" stroke="#7a4a00" stroke-width="1"/><circle cx="522" cy="166" r="3.2" fill="#fff3b0" stroke="#7a4a00" stroke-width="1"/>
  <rect x="300" y="40" width="300" height="150" fill="url(#sheen)" clip-path="url(#crownclip)" style="mix-blend-mode:screen"/>
</g>
<text x="450" y="242" text-anchor="middle" font-size="46" letter-spacing="3" fill="url(#title)" filter="url(#glow)">TECHNOBLADE NEVER DIES</text>
<text x="450" y="276" text-anchor="middle" font-size="13" letter-spacing="7" fill="#ffd166" opacity=".75" style="font-family:'Segoe UI',Arial,sans-serif;font-weight:700">BLOOD FOR THE BLOOD GOD</text>
</svg>